spring.application.name=bot

# Database Configuration (Single Monolithic URL)
spring.datasource.url=${JDBC_DATABASE_URL}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Logging
logging.level.com.alfred.bot=INFO

# WAHA Configuration
waha.api.key=${WAHA_API_KEY}
waha.base.url=${WAHA_BASE_URL:http://localhost:3000}
whatsapp.owner.number=${WHATS_OWNER_NUMBER}

spring.flyway.enabled=false
